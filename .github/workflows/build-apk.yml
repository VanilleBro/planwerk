name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Java 21
      # ----------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ----------------------------------------
      # Node.js 20
      # ----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------
      # Prepare Web Assets & Setup Capacitor
      # ----------------------------------------
      - name: Prepare Web Assets & Setup Capacitor
        run: |
          set -e

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"
          java -version

          echo "======================================"
          echo "NODE VERSION"
          echo "======================================"
          node --version
          npm --version

          echo "======================================"
          echo "PREPARING WEB ASSETS"
          echo "======================================"

          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          cp index.html www/

          find . -maxdepth 1 -type f -name "*.js" -exec cp {} www/ \; || true
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} www/ \; || true

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          echo "Contents of www:"
          find www -maxdepth 2 -type f -print

          echo "======================================"
          echo "INITIALIZING NPM"
          echo "======================================"

          npm init -y

          echo "======================================"
          echo "INSTALLING CAPACITOR"
          echo "======================================"

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "======================================"
          echo "CAPACITOR VERSIONS"
          echo "======================================"

          npx cap --version
          npm list @capacitor/core @capacitor/cli @capacitor/android

          echo "======================================"
          echo "CREATING ANDROID PROJECT"
          echo "======================================"

          rm -rf android

          npx cap init Planwerk com.planwerk.app --web-dir www

          npx cap add android

          echo "======================================"
          echo "SYNCING CAPACITOR"
          echo "======================================"

          npx cap sync android

          echo "======================================"
          echo "FIXING KOTLIN DEPENDENCIES"
          echo "======================================"

          cat >> android/app/build.gradle <<'EOF'

          // Fix Kotlin stdlib duplicate classes
          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

          echo "Kotlin dependency resolution added."

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          ls -la android

          echo "======================================"
          echo "APP BUILD.GRADLE"
          echo "======================================"

          cat android/app/build.gradle

          echo "======================================"
          echo "GRADLE WRAPPER"
          echo "======================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

      # ----------------------------------------
      # Build APK
      # ----------------------------------------
      - name: Build APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8 -Dorg.gradle.vfs.watch=false"
        run: |
          set -e

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          ./gradlew --version

          echo "======================================"
          echo "CLEARING GRADLE CACHE"
          echo "======================================"

          rm -rf ~/.gradle/caches/jars-9
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin

          echo "Gradle caches cleared."

          echo "======================================"
          echo "CLEAN"
          echo "======================================"

          ./gradlew clean \
            --no-daemon \
            --no-build-cache \
            --stacktrace

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --no-build-cache \
            --refresh-dependencies \
            --stacktrace

          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

          ls -lh app/build/outputs/apk/debug/

      # ----------------------------------------
      # Upload APK
      # ----------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planwerk-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
