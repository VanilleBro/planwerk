name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -r *.js *.css manifest.json www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap init Planwerk com.planwerk.app --web-dir www
          npx cap add android
          mkdir -p android/app/src/main/assets
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json
          npx cap sync android
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK with Gradle
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          GRADLE_OPTS: "-Xmx3072m -Dfile.encoding=UTF-8 -Dorg.gradle.vfs.watch=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel --no-build-cache --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planwerk-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
