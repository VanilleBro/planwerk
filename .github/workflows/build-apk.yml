name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Java 17
      # ----------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ----------------------------------------
      # Node.js 20
      # ----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------
      # Prepare Web Assets & Capacitor
      # ----------------------------------------
      - name: Prepare Web Assets & Setup Capacitor
        run: |
          set -e

          echo "======================================"
          echo "Preparing web assets"
          echo "======================================"

          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          cp index.html www/

          find . -maxdepth 1 -type f -name "*.js" -exec cp {} www/ \; || true
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} www/ \; || true

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          echo "Contents of www:"
          find www -maxdepth 2 -type f -print

          echo "======================================"
          echo "Installing Capacitor"
          echo "======================================"

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "======================================"
          echo "Creating Android project"
          echo "======================================"

          rm -rf android

          npx cap init Planwerk com.planwerk.app --web-dir www
          npx cap add android

          echo "======================================"
          echo "Syncing Capacitor"
          echo "======================================"

          npx cap sync android

          echo "======================================"
          echo "Android project created"
          echo "======================================"

          ls -la android
          cat android/gradle/wrapper/gradle-wrapper.properties

      # ----------------------------------------
      # Build APK
      # ----------------------------------------
      - name: Build APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8 -Dorg.gradle.vfs.watch=false"
        run: |
          set -e

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"
          java -version

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"
          ./gradlew --version

          echo "======================================"
          echo "GRADLE WRAPPER"
          echo "======================================"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "======================================"
          echo "CLEAN"
          echo "======================================"
          ./gradlew clean --no-daemon --stacktrace

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --no-build-cache \
            --refresh-dependencies \
            --stacktrace

      # ----------------------------------------
      # Upload APK
      # ----------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planwerk-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
