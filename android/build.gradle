// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty('android')) {
            if (subproject.android.namespace == null) {
                def manifestFile = file("${subproject.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestXml = new XmlParser().parse(manifestFile)
                    def packageName = manifestXml.@package
                    if (packageName) {
                        subproject.android.namespace = packageName
                    }
                }
            }
        }
    }
}